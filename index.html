<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061426">
<title>Projekt Nizza V12 Beta Fix 3 – Kalender</title>
<style>
:root{--bg:#03101e;--panel:#0c2542;--panel2:#123453;--line:#2b4f70;--text:#f4f8fc;--muted:#9fb3c9;--accent:#2edcc0;--blue:#2aa8ff;--yellow:#ffd400;--red:#ff6176;--green:#37d58b;--radius:22px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(#061426,#020912);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-bottom:92px}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;padding:18px 20px;background:rgba(4,16,30,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:.72rem;letter-spacing:.22em;font-weight:800;color:#aac0d8}.top h1{margin:6px 0 0;font-size:1.45rem}.top h1 b{color:var(--accent)}.round{width:54px;height:54px;border:0;border-radius:50%;font-size:2rem;background:linear-gradient(135deg,var(--blue),var(--accent));color:#04101f;font-weight:900}main{max-width:900px;margin:auto;padding:16px}.view{display:none}.view.active{display:block}.card,.team-card,.stage-card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.section-head h2,.section-head h3{margin:0}.muted{color:var(--muted)}.primary,.secondary,.danger,.tab,.icon{border:0;border-radius:14px;padding:12px 15px;color:white}.primary{background:linear-gradient(135deg,var(--blue),var(--accent));font-weight:800}.secondary{background:#122d4a;border:1px solid var(--line)}.danger{background:#4b1b29;color:#ffd0d7}.icon{width:44px;height:44px;padding:0;background:#153250;font-size:1.25rem}.bottom{position:fixed;z-index:25;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#061426;border-top:1px solid var(--line);padding:9px 5px calc(9px + env(safe-area-inset-bottom))}.bottom button{border:0;background:none;color:#8399b2;display:flex;flex-direction:column;align-items:center;gap:4px}.bottom button.active{color:var(--accent);font-weight:800}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tab{background:#102b48;border:1px solid var(--line);white-space:nowrap}.tab.active{background:var(--blue)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#071a2d;border:1px solid var(--line);border-radius:16px;padding:13px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:1.25rem}.empty{text-align:center;color:var(--muted);padding:28px;border:1px dashed #3a5e7d;border-radius:18px}.team-card{border-left:8px solid var(--team,#2aa8ff)}.rider-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.rider{background:#09213a;border:1px solid var(--line);border-left:7px solid #7f8fa3;border-radius:16px;padding:13px}.rider.gc{border-left-color:var(--yellow)}.rider.climber{border-left-color:var(--red)}.rider.helper{border-left-color:var(--blue)}.rider.sprinter{border-left-color:var(--green)}.rider strong{display:block}.rider span{color:var(--muted);font-size:.85rem}.stage-card{display:flex;justify-content:space-between;align-items:center;gap:12px}.stage-card h3{margin:0 0 5px}.class-row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.class-row .rank{font-weight:900;font-size:1.15rem}.class-row small{display:block;color:var(--muted);margin-top:3px}.class-row .value{text-align:right;font-weight:800;white-space:nowrap}.modal{width:min(94vw,650px);max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:24px;background:#091f36;color:white;padding:20px}.modal.full{width:100vw;height:100dvh;max-width:none;max-height:none;border-radius:0;border:0;margin:0;padding:0}.modal::backdrop{background:rgba(0,0,0,.78)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-head h2{margin:0}.full-head{position:sticky;top:0;z-index:5;background:#061426;border-bottom:1px solid var(--line);padding:17px;display:flex;justify-content:space-between;align-items:center}.full-body{padding:16px;max-width:760px;margin:auto}.full-tabs{position:sticky;top:78px;z-index:4;background:#061426;border-bottom:1px solid var(--line);padding:9px 14px;display:flex;gap:8px;overflow:auto}label{display:block;color:#bfd0e2;font-weight:700;margin:12px 0}input,select,textarea{width:100%;margin-top:7px;padding:13px;border-radius:13px;border:1px solid #365d7e;background:#05182a;color:white}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.picker-team{margin-bottom:16px}.picker-team h3{margin:0 0 9px}.picker-rider{width:100%;text-align:left;background:#0b2845;border:1px solid var(--line);border-radius:15px;color:white;padding:13px;margin-bottom:8px}.mapbox{background:#082039;border:1px solid var(--line);border-radius:20px;padding:14px}.route{height:14px;background:#1a3c58;border-radius:99px;overflow:hidden;margin:18px 0}.route span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--accent))}.mapline{position:relative;height:130px;margin-top:12px}.mapline:before{content:"";position:absolute;left:6%;right:6%;top:64px;height:7px;border-radius:99px;background:#254761}.mapline .done{position:absolute;left:6%;top:64px;height:7px;border-radius:99px;background:var(--accent)}.mapline .bike{position:absolute;top:37px;transform:translateX(-50%);font-size:28px}.mapline .p{position:absolute;top:54px;width:22px;height:22px;border:4px solid var(--accent);background:white;border-radius:50%;transform:translateX(-50%)}.mapline .label{position:absolute;top:88px;transform:translateX(-50%);font-size:.72rem;color:var(--muted)}

/* Trainingskalender */
.calendar-shell{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.calendar-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}.calendar-top h2{margin:4px 0 0}.calendar-modes{display:flex;gap:8px;overflow:auto;margin:0 0 12px}.calendar-nav{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center;margin-bottom:14px}.calendar-nav button{height:46px}.calendar-period{text-align:center;font-weight:850;font-size:1.05rem}.week-list{display:grid;gap:11px}.day-card{background:#082039;border:1px solid var(--line);border-radius:18px;padding:13px;display:grid;grid-template-columns:74px 1fr;gap:13px;align-items:stretch;cursor:pointer}.day-card.today{border-color:var(--accent);box-shadow:0 0 0 2px rgba(46,220,192,.15)}.day-card.selected{background:#0d2d4d}.day-date{background:#06172a;border:1px solid #284c6c;border-radius:15px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;justify-content:center}.day-date small{color:var(--muted);font-weight:800;text-transform:uppercase}.day-date strong{font-size:1.65rem;line-height:1.05}.day-date span{font-size:.74rem;color:var(--muted)}.day-events{display:grid;gap:8px;min-width:0}.training-chip{width:100%;text-align:left;color:white;background:#103252;border:1px solid #355d7f;border-radius:14px;padding:11px}.training-chip.done{border-color:var(--green);background:#0b3a38}.training-chip strong{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.training-chip small{display:block;color:var(--muted);margin-top:5px}.day-empty{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);min-height:70px}.day-empty .secondary{flex:0 0 auto}.day-detail{background:#082039;border:1px solid var(--line);border-radius:20px;padding:18px}.day-detail h3{font-size:1.35rem;margin:6px 0 8px}.detail-date{font-size:1.05rem;font-weight:850}.detail-meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.pill{background:#061a2d;border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:#cfe0ef;font-size:.86rem}.detail-text{line-height:1.55;color:#d8e5f1}.month-weekdays,.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.month-weekdays{margin-bottom:6px}.month-weekdays div{text-align:center;color:var(--muted);font-size:.72rem;font-weight:850}.month-cell{min-height:78px;border:1px solid var(--line);border-radius:12px;background:#071a2d;color:white;padding:7px;text-align:left;overflow:hidden}.month-cell.blank{opacity:.18;pointer-events:none}.month-cell.today{border-color:var(--accent)}.month-cell.selected{background:#123b60}.month-number{display:block;font-weight:850;margin-bottom:5px}.month-event{display:block;font-size:.64rem;line-height:1.15;padding:3px 4px;border-radius:6px;background:#12436b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.month-event.done{background:#12604f}.calendar-legend{margin-top:12px;color:var(--muted);font-size:.8rem}.status-badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;font-size:.78rem;font-weight:800;background:#153250;color:#cddceb}.status-badge.done{background:#125449;color:#aaf3df}.training-form-hint{margin:-3px 0 10px;color:var(--muted);font-size:.84rem}
@media(max-width:560px){.calendar-top{align-items:center}.calendar-top .primary{padding:11px 12px}.day-card{grid-template-columns:66px 1fr;padding:11px}.day-date strong{font-size:1.45rem}.month-cell{min-height:68px;padding:5px}.month-event{font-size:.58rem}.calendar-shell{padding:13px}}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.top h1{font-size:1.25rem}.rider-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top"><div><div class="eyebrow">DEINE RADSPORT-KARRIERE</div><h1>Projekt Nizza <b>V12 Beta Fix 3</b></h1></div><button id="quick" class="round">+</button></header>
<main>
<section id="view-start" class="view active"></section>
<section id="view-training" class="view"></section>
<section id="view-map" class="view"></section>
<section id="view-tours" class="view"></section>
<section id="view-stats" class="view"></section>
</main>
<nav class="bottom">
<button data-view="start" class="active"><span>⌂</span>Start</button><button data-view="training"><span>▦</span>Training</button><button data-view="map"><span>◎</span>Karte</button><button data-view="tours"><span>♛</span>Touren</button><button data-view="stats"><span>▥</span>Statistik</button>
</nav>
<dialog id="modal" class="modal"></dialog>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const KEY='projekt-nizza-v12-fix2';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const roleLabel={gc:'Gesamtfahrer',climber:'Bergfahrer',helper:'Helfer',sprinter:'Sprinter'};
let state=load();
let trainingMode='week';
const todayLocal=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const parseLocalDate=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const localIso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const startMonday=d=>{const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x};
let trainingAnchor=parseLocalDate(todayLocal());
let selectedTrainingDate=todayLocal();
function fresh(){return{trainings:[],tours:[],activeTourId:null}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&typeof v==='object'?Object.assign(fresh(),v):fresh()}catch{return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderAll()}
function modal(html,full=false){const d=$('#modal');d.className='modal'+(full?' full':'');d.innerHTML=html;d.showModal();$$('[data-close]',d).forEach(b=>b.onclick=()=>d.close())}
function show(view){$$('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+view));$$('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));renderAll()}
$$('.bottom button').forEach(b=>b.onclick=()=>show(b.dataset.view));
$('#quick').onclick=()=>{const active=$('.bottom button.active')?.dataset.view||'start';if(active==='tours')openTourForm();else openTrainingForm(null,active==='training'?selectedTrainingDate:todayLocal())};
function totals(){return state.trainings.filter(x=>x.done).reduce((a,x)=>{a.km+=+x.km||0;a.hm+=+x.hm||0;a.min+=+x.min||0;return a},{km:0,hm:0,min:0})}
function renderAll(){renderStart();renderTraining();renderMap();renderTours();renderStats()}
function renderStart(){const t=totals(),tour=activeTour();$('#view-start').innerHTML=`<article class="card"><div class="eyebrow">HEUTE IM BLICK</div><h2>${state.trainings.length?'Dein Plan steht':'Noch kein Training geplant'}</h2><p class="muted">Training, virtuelle Reise und deine Rundfahrten an einem Ort.</p><div class="stats"><div class="stat"><small>Kilometer</small><strong>${t.km.toFixed(0)}</strong></div><div class="stat"><small>Höhenmeter</small><strong>${t.hm.toFixed(0)}</strong></div><div class="stat"><small>Aktive Tour</small><strong>${esc(tour?.name||'–')}</strong></div></div></article><article class="card"><div class="section-head"><h3>Nächster Schritt</h3></div><button class="primary" onclick="show('training')">Training öffnen</button> <button class="secondary" onclick="show('tours')">Touren öffnen</button></article>`}
function openTrainingForm(x=null,presetDate=null){
 const date=x?.date||presetDate||selectedTrainingDate||todayLocal();
 modal(`<div class="modal-head"><h2>${x?'Training bearbeiten':'Training anlegen'}</h2><button data-close class="icon">×</button></div><form id="trainingForm"><label>Datum<input id="trDate" type="date" value="${date}" required></label><label>Titel<input id="trTitle" value="${esc(x?.title||'')}" placeholder="z. B. Grundlagenfahrt" required></label><div class="grid2"><label>Art<select id="trType"><option ${x?.type==='Grundlage'?'selected':''}>Grundlage</option><option ${x?.type==='Lange Fahrt'?'selected':''}>Lange Fahrt</option><option ${x?.type==='Sweetspot'?'selected':''}>Sweetspot</option><option ${x?.type==='Bergtraining'?'selected':''}>Bergtraining</option><option ${x?.type==='Regeneration'?'selected':''}>Regeneration</option><option ${x?.type==='Fußball'?'selected':''}>Fußball</option><option ${x?.type==='Kraft'?'selected':''}>Kraft</option><option ${x?.type==='Mobility'?'selected':''}>Mobility</option><option ${x?.type==='Ruhetag'?'selected':''}>Ruhetag</option><option ${x?.type==='Sonstiges'?'selected':''}>Sonstiges</option></select></label><label>Zone / Intensität<input id="trZone" value="${esc(x?.zone||'')}" placeholder="z. B. Z2"></label></div><div class="grid2"><label>Kilometer<input id="trKm" type="number" step="0.1" min="0" value="${x?.km||0}"></label><label>Höhenmeter<input id="trHm" type="number" min="0" value="${x?.hm||0}"></label></div><label>Dauer Minuten<input id="trMin" type="number" min="0" value="${x?.min||0}"></label><label>Details<textarea id="trDetails" rows="4" placeholder="Was genau ist geplant?">${esc(x?.details||'')}</textarea></label><label style="display:flex;align-items:center;gap:10px"><input id="trDone" type="checkbox" ${x?.done?'checked':''} style="width:auto;margin:0"> Training erledigt</label><p class="training-form-hint">Plan und tatsächliche Einheit bleiben in diesem einen Eintrag.</p><div class="actions"><button class="primary">Speichern</button>${x?'<button type="button" id="delTraining" class="danger">Löschen</button>':''}</div></form>`);
 $('#trainingForm').onsubmit=e=>{e.preventDefault();const obj={id:x?.id||uid(),date:$('#trDate').value,title:$('#trTitle').value.trim(),type:$('#trType').value,zone:$('#trZone').value.trim(),km:+$('#trKm').value||0,hm:+$('#trHm').value||0,min:+$('#trMin').value||0,details:$('#trDetails').value.trim(),done:$('#trDone').checked};const duplicate=state.trainings.find(a=>a.date===obj.date&&a.id!==obj.id);if(duplicate&&!confirm(`Am ${obj.date} gibt es schon "${duplicate.title}". Dieses Training ersetzen?`))return;state.trainings=state.trainings.filter(a=>a.id!==obj.id&&a.id!==duplicate?.id);state.trainings.push(obj);selectedTrainingDate=obj.date;trainingAnchor=parseLocalDate(obj.date);$('#modal').close();save();show('training')};
 if(x)$('#delTraining').onclick=()=>{if(!confirm('Training wirklich löschen?'))return;state.trainings=state.trainings.filter(a=>a.id!==x.id);$('#modal').close();save()}
}
function trainingsOn(date){return state.trainings.filter(x=>x.date===date).sort((a,b)=>a.title.localeCompare(b.title,'de'))}
function dayName(date,full=false){return new Intl.DateTimeFormat('de-DE',{weekday:full?'long':'short'}).format(date)}
function fullDate(date){return new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(date)}
function monthTitle(date){return new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'}).format(date)}
function metricText(x){const bits=[];if(x.type)bits.push(x.type);if(x.min)bits.push(`${x.min} Min`);if(x.zone)bits.push(x.zone);if(x.km)bits.push(`${x.km} km`);if(x.hm)bits.push(`${x.hm} hm`);return bits.join(' · ')||'Details öffnen'}
function trainingChip(x){return `<button class="training-chip ${x.done?'done':''}" data-tr="${x.id}"><strong>${esc(x.title)}</strong><small>${esc(metricText(x))}${x.done?' · ✓ erledigt':''}</small></button>`}
function dayCard(date){const iso=localIso(date),events=trainingsOn(iso),today=iso===todayLocal(),selected=iso===selectedTrainingDate;return `<article class="day-card ${today?'today':''} ${selected?'selected':''}" data-day-open="${iso}"><div class="day-date"><small>${esc(dayName(date))}</small><strong>${String(date.getDate()).padStart(2,'0')}</strong><span>${String(date.getMonth()+1).padStart(2,'0')}.${date.getFullYear()}</span></div><div class="day-events">${events.length?events.map(trainingChip).join(''):`<div class="day-empty"><span>Kein Training geplant</span><button class="secondary" data-add-date="${iso}">+ Eintragen</button></div>`}</div></article>`}
function dayDetail(date){const iso=localIso(date),events=trainingsOn(iso);return `<div class="detail-date">${esc(fullDate(date))}</div>${events.length?events.map(x=>`<article class="day-detail"><div class="section-head"><div><span class="status-badge ${x.done?'done':''}">${x.done?'✓ Erledigt':'Geplant'}</span><h3>${esc(x.title)}</h3></div><button class="icon" data-tr="${x.id}" aria-label="Bearbeiten">✎</button></div><div class="detail-meta">${x.type?`<span class="pill">${esc(x.type)}</span>`:''}${x.zone?`<span class="pill">${esc(x.zone)}</span>`:''}${x.min?`<span class="pill">${x.min} Min</span>`:''}${x.km?`<span class="pill">${x.km} km</span>`:''}${x.hm?`<span class="pill">${x.hm} hm</span>`:''}</div>${x.details?`<p class="detail-text">${esc(x.details)}</p>`:'<p class="muted">Keine Details eingetragen.</p>'}<div class="actions"><button class="primary" data-tr="${x.id}">Öffnen & bearbeiten</button></div></article>`).join(''):`<div class="empty"><h3>Kein Training geplant</h3><p>Lege für diesen Tag deine Einheit an.</p><button class="primary" data-add-date="${iso}">+ Training anlegen</button></div>`}`}
function monthGrid(date){const y=date.getFullYear(),m=date.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),offset=(first.getDay()+6)%7;let html='<div class="month-weekdays">'+['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div>${x}</div>`).join('')+'</div><div class="month-grid">';for(let i=0;i<offset;i++)html+='<div class="month-cell blank"></div>';for(let day=1;day<=last.getDate();day++){const d=new Date(y,m,day),iso=localIso(d),events=trainingsOn(iso);html+=`<button class="month-cell ${iso===todayLocal()?'today':''} ${iso===selectedTrainingDate?'selected':''}" data-month-date="${iso}"><span class="month-number">${day}</span>${events.slice(0,2).map(x=>`<span class="month-event ${x.done?'done':''}">${esc(x.title)}</span>`).join('')}${events.length>2?`<span class="month-event">+${events.length-2}</span>`:''}</button>`}return html+'</div>'}
function bindTrainingCalendar(){
 $('#addTraining').onclick=()=>openTrainingForm(null,selectedTrainingDate);
 $$('[data-calendar-mode]').forEach(b=>b.onclick=()=>{trainingMode=b.dataset.calendarMode;renderTraining()});
 $('#calPrev').onclick=()=>{trainingAnchor=trainingMode==='month'?new Date(trainingAnchor.getFullYear(),trainingAnchor.getMonth()-1,1):addDays(trainingAnchor,trainingMode==='week'?-7:-1);selectedTrainingDate=localIso(trainingAnchor);renderTraining()};
 $('#calNext').onclick=()=>{trainingAnchor=trainingMode==='month'?new Date(trainingAnchor.getFullYear(),trainingAnchor.getMonth()+1,1):addDays(trainingAnchor,trainingMode==='week'?7:1);selectedTrainingDate=localIso(trainingAnchor);renderTraining()};
 $('#calToday').onclick=()=>{trainingAnchor=parseLocalDate(todayLocal());selectedTrainingDate=todayLocal();renderTraining()};
 $$('[data-tr]').forEach(b=>b.onclick=e=>{e.stopPropagation();openTrainingForm(state.trainings.find(x=>x.id===b.dataset.tr))});
 $$('[data-add-date]').forEach(b=>b.onclick=e=>{e.stopPropagation();selectedTrainingDate=b.dataset.addDate;openTrainingForm(null,b.dataset.addDate)});
 $$('[data-day-open]').forEach(card=>card.onclick=e=>{if(e.target.closest('[data-tr],[data-add-date]'))return;selectedTrainingDate=card.dataset.dayOpen;trainingAnchor=parseLocalDate(selectedTrainingDate);trainingMode='day';renderTraining()});
 $$('[data-month-date]').forEach(b=>b.onclick=()=>{selectedTrainingDate=b.dataset.monthDate;trainingAnchor=parseLocalDate(selectedTrainingDate);trainingMode='day';renderTraining()});
}
function renderTraining(){
 const root=$('#view-training');let content='',period='';
 if(trainingMode==='week'){const start=startMonday(trainingAnchor),end=addDays(start,6);period=`${String(start.getDate()).padStart(2,'0')}.${String(start.getMonth()+1).padStart(2,'0')}. – ${String(end.getDate()).padStart(2,'0')}.${String(end.getMonth()+1).padStart(2,'0')}.${end.getFullYear()}`;content=`<div class="week-list">${Array.from({length:7},(_,i)=>dayCard(addDays(start,i))).join('')}</div>`}
 else if(trainingMode==='month'){period=monthTitle(trainingAnchor);content=monthGrid(trainingAnchor)}
 else{const d=parseLocalDate(selectedTrainingDate);period=fullDate(d);content=dayDetail(d)}
 root.innerHTML=`<div class="calendar-shell"><div class="calendar-top"><div><div class="eyebrow">TRAININGSKALENDER</div><h2>Wann mache ich was?</h2></div><button id="addTraining" class="primary">+ Einheit</button></div><div class="calendar-modes"><button data-calendar-mode="day" class="tab ${trainingMode==='day'?'active':''}">Tag</button><button data-calendar-mode="week" class="tab ${trainingMode==='week'?'active':''}">Woche</button><button data-calendar-mode="month" class="tab ${trainingMode==='month'?'active':''}">Monat</button></div><div class="calendar-nav"><button id="calPrev" class="secondary">‹</button><button id="calToday" class="secondary calendar-period">${esc(period)}</button><button id="calNext" class="secondary">›</button></div>${content}<div class="calendar-legend">Tippe auf einen Tag für die Tagesansicht. Tippe auf eine Einheit, um sie zu bearbeiten.</div></div>`;
 bindTrainingCalendar()
}
function renderMap(){const t=totals(),progress=Math.min(100,t.km/1100*100);const points=[['Haibach',6],['Wasserburg',25],['Schwaz',43],['Landeck',57],['Bormio',70],['Nizza',94]];$('#view-map').innerHTML=`<div class="section-head"><div><div class="eyebrow">VIRTUELLE REISE</div><h2>Haibach → Nizza</h2></div></div><article class="mapbox"><div class="mapline"><div class="done" style="width:${progress*.88}%"></div><div class="bike" style="left:${6+progress*.88}%">🚴</div>${points.map(p=>`<i class="p" style="left:${p[1]}%"></i><span class="label" style="left:${p[1]}%">${p[0]}</span>`).join('')}</div><div class="route"><span style="width:${progress}%"></span></div><strong>${t.km.toFixed(0)} / 1100 km</strong><p class="muted">Der Radfahrer bewegt sich mit deinen als erledigt markierten Radkilometern.</p></article>`}
function activeTour(){return state.tours.find(t=>t.id===state.activeTourId)||state.tours[0]||null}
function openTourForm(){modal(`<div class="modal-head"><h2>Neue Tour</h2><button data-close class="icon">×</button></div><form id="tourForm"><label>Name<input id="tourName" placeholder="z. B. Tour de l'Ain" required></label><div class="actions"><button class="primary">Tour erstellen</button></div></form>`);$('#tourForm').onsubmit=e=>{e.preventDefault();const t={id:uid(),name:$('#tourName').value.trim(),teams:[],stages:[]};state.tours.push(t);state.activeTourId=t.id;$('#modal').close();save();show('tours')}}
function openTeamForm(t){modal(`<div class="modal-head"><h2>Team anlegen</h2><button data-close class="icon">×</button></div><form id="teamForm"><label>Teamname<input id="teamName" required></label><label>Teamfarbe<input id="teamColor" type="color" value="#2aa8ff"></label><div class="actions"><button class="primary">Speichern</button></div></form>`);$('#teamForm').onsubmit=e=>{e.preventDefault();t.teams.push({id:uid(),name:$('#teamName').value.trim(),color:$('#teamColor').value,riders:[]});$('#modal').close();save();openTour(t.id,'teams')}}
function openRiderForm(t,team){modal(`<div class="modal-head"><h2>Fahrer anlegen</h2><button data-close class="icon">×</button></div><form id="riderForm"><label>Name<input id="riderName" required></label><label>Rolle<select id="riderRole"><option value="gc">Gesamtfahrer</option><option value="climber">Bergfahrer</option><option value="helper">Helfer</option><option value="sprinter">Sprinter</option></select></label><div class="actions"><button class="primary">Fahrer speichern</button></div></form>`);$('#riderForm').onsubmit=e=>{e.preventDefault();team.riders.push({id:uid(),name:$('#riderName').value.trim(),role:$('#riderRole').value});$('#modal').close();save();openTour(t.id,'teams')}}
function openStageForm(t){modal(`<div class="modal-head"><h2>Etappe anlegen</h2><button data-close class="icon">×</button></div><form id="stageForm"><label>Etappenname<input id="stageName" placeholder="Etappe 1" required></label><label>Datum<input id="stageDate" type="date"></label><div class="actions"><button class="primary">Speichern</button></div></form>`);$('#stageForm').onsubmit=e=>{e.preventDefault();t.stages.push({id:uid(),name:$('#stageName').value.trim(),date:$('#stageDate').value,results:[],mountain:[],sprint:[]});$('#modal').close();save();openTour(t.id,'stages')}}
function renderTours(){const t=activeTour();$('#view-tours').innerHTML=`<div class="section-head"><div><div class="eyebrow">MEINE RUNDFAHRTEN</div><h2>${esc(t?.name||'Noch keine Tour')}</h2></div><button id="newTour" class="primary">+ Tour</button></div>${state.tours.length?`<div class="tabs">${state.tours.map(x=>`<button data-tour-select="${x.id}" class="tab ${x.id===t?.id?'active':''}">${esc(x.name)}</button>`).join('')}</div><article class="card"><div class="tabs"><button id="goTeams" class="tab">Teams</button><button id="goStages" class="tab">Etappen</button><button id="goOverall" class="tab">Gesamt</button></div><p class="muted">Teams, Fahrer und Wertungen sind sauber getrennt.</p></article>`:'<div class="empty">Erstelle deine erste Tour.</div>'}`;$('#newTour').onclick=openTourForm;$$('[data-tour-select]').forEach(b=>b.onclick=()=>{state.activeTourId=b.dataset.tourSelect;save()});if(t){$('#goTeams').onclick=()=>openTour(t.id,'teams');$('#goStages').onclick=()=>openTour(t.id,'stages');$('#goOverall').onclick=()=>openTour(t.id,'overall')}}
function openTour(id,tab='teams'){const t=state.tours.find(x=>x.id===id);if(!t)return;modal(`<div class="full-head"><div><div class="eyebrow">TOUR</div><h2>${esc(t.name)}</h2></div><button data-close class="icon">×</button></div><div class="full-tabs"><button data-tourtab="teams" class="tab">Teams</button><button data-tourtab="stages" class="tab">Etappen</button><button data-tourtab="overall" class="tab">Gesamt</button></div><div id="tourBody" class="full-body"></div>`,true);$$('[data-tourtab]').forEach(b=>b.onclick=()=>drawTourTab(t,b.dataset.tourtab));drawTourTab(t,tab)}
function allRiders(t){return t.teams.flatMap(team=>team.riders.map(r=>({...r,teamId:team.id,teamName:team.name})))}
function drawTourTab(t,tab){$$('[data-tourtab]').forEach(b=>b.classList.toggle('active',b.dataset.tourtab===tab));const root=$('#tourBody');if(tab==='teams'){root.innerHTML=`<div class="section-head"><h3>Teams</h3><button id="addTeam" class="primary">+ Team</button></div>${t.teams.map(team=>`<article class="team-card" style="--team:${team.color}"><div class="section-head"><div><h3>${esc(team.name)}</h3><p class="muted">${team.riders.length} Fahrer</p></div><button data-add-rider="${team.id}" class="secondary">+ Fahrer</button></div><div class="rider-grid">${team.riders.map(r=>`<div class="rider ${r.role}"><strong>${esc(r.name)}</strong><span>${roleLabel[r.role]}</span></div>`).join('')||'<div class="empty">Noch kein Fahrer.</div>'}</div></article>`).join('')||'<div class="empty">Noch kein Team.</div>'}`;$('#addTeam').onclick=()=>openTeamForm(t);$$('[data-add-rider]').forEach(b=>b.onclick=()=>openRiderForm(t,t.teams.find(x=>x.id===b.dataset.addRider)))}else if(tab==='stages'){root.innerHTML=`<div class="section-head"><h3>Etappen</h3><button id="addStage" class="primary">+ Etappe</button></div>${t.stages.map((s,i)=>`<button data-open-stage="${s.id}" class="stage-card" style="width:100%;color:white;text-align:left"><div><small class="muted">Etappe ${i+1}${s.date?' · '+esc(s.date):''}</small><h3>${esc(s.name)}</h3><span class="muted">${s.results.length} Zeiten · ${s.mountain.length} Berg · ${s.sprint.length} Sprint</span></div><span>›</span></button>`).join('')||'<div class="empty">Noch keine Etappe.</div>'}`;$('#addStage').onclick=()=>openStageForm(t);$$('[data-open-stage]').forEach(b=>b.onclick=()=>openStage(t,t.stages.find(x=>x.id===b.dataset.openStage),'stage'))}else{drawOverall(t,root)}}
function riderName(t,id){return allRiders(t).find(r=>r.id===id)?.name||'Unbekannt'}
function teamName(t,id){return allRiders(t).find(r=>r.id===id)?.teamName||''}
function fmtTime(sec){sec=Math.max(0,Math.round(sec||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function fmtGap(sec){sec=Math.max(0,Math.round(sec||0));const m=Math.floor(sec/60),s=sec%60;return `+${m?m+':':''}${String(s).padStart(2,'0')}`}
function orderedStages(t){return [...t.stages]}
function gcAfter(t,stage){const stages=orderedStages(t).slice(0,orderedStages(t).indexOf(stage)+1),riders=allRiders(t),rows=[];for(const r of riders){let total=0,ok=true;for(const s of stages){const e=s.results.find(x=>x.riderId===r.id);if(!e){ok=false;break}total+=e.time}if(ok&&stages.length)rows.push({riderId:r.id,time:total})}return rows.sort((a,b)=>a.time-b.time)}
function pointsAfter(t,stage,key){const stages=orderedStages(t).slice(0,orderedStages(t).indexOf(stage)+1),map=new Map();for(const s of stages)for(const e of s[key])map.set(e.riderId,(map.get(e.riderId)||0)+e.points);return [...map].map(([riderId,points])=>({riderId,points})).sort((a,b)=>b.points-a.points)}
function chooseRiderByTeam(t,cb){modal(`<div class="modal-head"><h2>Fahrer auswählen</h2><button data-close class="icon">×</button></div>${t.teams.map(team=>`<section class="picker-team"><h3>${esc(team.name)}</h3>${team.riders.map(r=>`<button data-pick="${r.id}" class="picker-rider"><strong>${esc(r.name)}</strong><span class="muted"> · ${roleLabel[r.role]}</span></button>`).join('')||'<p class="muted">Keine Fahrer.</p>'}</section>`).join('')||'<div class="empty">Lege zuerst Teams und Fahrer an.</div>'}`);$$('[data-pick]').forEach(b=>b.onclick=()=>{const id=b.dataset.pick;$('#modal').close();cb(id)})}
function addStageResult(t,s){chooseRiderByTeam(t,id=>{const existing=s.results.find(x=>x.riderId===id),leader=[...s.results].sort((a,b)=>a.time-b.time)[0];const isLeader=!leader||leader.riderId===id;modal(`<div class="modal-head"><h2>${isLeader?'Siegerzeit':'Zeitabstand'}</h2><button data-close class="icon">×</button></div><form id="resultForm">${isLeader?`<div class="grid2"><label>Stunden<input id="h" type="number" min="0" value="${existing?Math.floor(existing.time/3600):0}"></label><label>Minuten<input id="m" type="number" min="0" max="59" value="${existing?Math.floor(existing.time%3600/60):0}"></label></div><label>Sekunden<input id="s" type="number" min="0" max="59" value="${existing?existing.time%60:0}"></label>`:`<p class="muted">Nur Rückstand zum Etappensieger eintragen.</p><label>Minuten<input id="m" type="number" min="0" value="${existing&&leader?Math.floor((existing.time-leader.time)/60):0}"></label><label>Sekunden<input id="s" type="number" min="0" max="59" value="${existing&&leader?(existing.time-leader.time)%60:0}"></label>`}<div class="actions"><button class="primary">Speichern</button></div></form>`);$('#resultForm').onsubmit=e=>{e.preventDefault();let time;if(isLeader)time=(+$('#h').value||0)*3600+(+$('#m').value||0)*60+(+$('#s').value||0);else time=leader.time+(+$('#m').value||0)*60+(+$('#s').value||0);s.results=s.results.filter(x=>x.riderId!==id);s.results.push({riderId:id,time});$('#modal').close();save();openStage(t,s,'stage')}})}
function addPoints(t,s,key){chooseRiderByTeam(t,id=>{const ex=s[key].find(x=>x.riderId===id);modal(`<div class="modal-head"><h2>${key==='mountain'?'Bergpunkte':'Sprintpunkte'}</h2><button data-close class="icon">×</button></div><form id="pointsForm"><label>Punkte<input id="points" type="number" min="0" value="${ex?.points||0}"></label><div class="actions"><button class="primary">Speichern</button></div></form>`);$('#pointsForm').onsubmit=e=>{e.preventDefault();const p=+$('#points').value||0;s[key]=s[key].filter(x=>x.riderId!==id);if(p>0)s[key].push({riderId:id,points:p});$('#modal').close();save();openStage(t,s,key)}})}
function openStage(t,s,tab='stage'){modal(`<div class="full-head"><div><div class="eyebrow">ETAPPE</div><h2>${esc(s.name)}</h2></div><button data-close class="icon">×</button></div><div class="full-tabs"><button data-stagetab="overall" class="tab">Gesamt</button><button data-stagetab="stage" class="tab">Etappe</button><button data-stagetab="mountain" class="tab">Berg</button><button data-stagetab="sprint" class="tab">Sprint</button></div><div id="stageBody" class="full-body"></div>`,true);$$('[data-stagetab]').forEach(b=>b.onclick=()=>drawStageTab(t,s,b.dataset.stagetab));drawStageTab(t,s,tab)}
function rowsHtml(t,rows,type){if(!rows.length)return '<div class="empty">Noch keine Einträge.</div>';const leader=type==='time'?rows[0].time:0;return rows.map((r,i)=>`<div class="class-row"><div class="rank">${i+1}</div><div><strong>${esc(riderName(t,r.riderId))}</strong><small>${esc(teamName(t,r.riderId))}</small></div><div class="value">${type==='time'?(i===0?fmtTime(r.time):fmtGap(r.time-leader)):r.points+' P'}</div></div>`).join('')}
function drawStageTab(t,s,tab){$$('[data-stagetab]').forEach(b=>b.classList.toggle('active',b.dataset.stagetab===tab));const root=$('#stageBody');if(tab==='stage'){const rows=[...s.results].sort((a,b)=>a.time-b.time);root.innerHTML=`<article class="card"><div class="section-head"><div><h3>Etappenergebnis</h3><p class="muted">Siegerzeit, danach nur Abstände.</p></div><button id="addResult" class="primary">+ Zeit</button></div>${rowsHtml(t,rows,'time')}</article>`;$('#addResult').onclick=()=>addStageResult(t,s)}else if(tab==='mountain'||tab==='sprint'){const rows=[...s[tab]].sort((a,b)=>b.points-a.points);root.innerHTML=`<article class="card"><div class="section-head"><h3>${tab==='mountain'?'Bergwertung':'Sprintwertung'}</h3><button id="addPts" class="primary">+ Punkte</button></div>${rowsHtml(t,rows,'points')}</article>`;$('#addPts').onclick=()=>addPoints(t,s,tab)}else{const gc=gcAfter(t,s),m=pointsAfter(t,s,'mountain'),sp=pointsAfter(t,s,'sprint');root.innerHTML=`<article class="card"><h3>Gesamtklassement</h3>${rowsHtml(t,gc,'time')}</article><article class="card"><h3>Gesamt-Bergwertung</h3>${rowsHtml(t,m,'points')}</article><article class="card"><h3>Gesamt-Sprintwertung</h3>${rowsHtml(t,sp,'points')}</article>`}}
function drawOverall(t,root){const last=[...t.stages].reverse().find(s=>s.results.length||s.mountain.length||s.sprint.length);if(!last){root.innerHTML='<div class="empty">Noch keine Wertungen.</div>';return}root.innerHTML=`<article class="card"><h3>Gesamt nach ${esc(last.name)}</h3>${rowsHtml(t,gcAfter(t,last),'time')}</article><article class="card"><h3>Bergwertung gesamt</h3>${rowsHtml(t,pointsAfter(t,last,'mountain'),'points')}</article><article class="card"><h3>Sprintwertung gesamt</h3>${rowsHtml(t,pointsAfter(t,last,'sprint'),'points')}</article>`}
function renderStats(){const t=totals();$('#view-stats').innerHTML=`<div class="section-head"><div><div class="eyebrow">STATISTIK</div><h2>Dein Fortschritt</h2></div></div><div class="stats"><div class="stat"><small>Kilometer</small><strong>${t.km.toFixed(0)}</strong></div><div class="stat"><small>Höhenmeter</small><strong>${t.hm.toFixed(0)}</strong></div><div class="stat"><small>Fahrzeit</small><strong>${Math.floor(t.min/60)} h</strong></div></div>`}
renderAll();
</script>
</body></html>
