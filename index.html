<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>Projekt Nizza V12 – Schritt 2</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">PROJEKT NIZZA · V12 SCHRITT 2</div>
        <h1 id="pageTitle">Start</h1>
      </div>
      <button class="icon-button" id="backupBtn" aria-label="Backup">⇩</button>
    </header>

    <main>
      <section id="page-home" class="page active"></section>

      <section id="page-training" class="page">
        <section class="hero-card compact">
          <div>
            <div class="muted">Nächster Fokus</div>
            <h2 id="nextWorkoutTitle">Noch kein Training geplant</h2>
            <p id="nextWorkoutMeta">Lege deinen ersten Trainingstag an.</p>
          </div>
          <button class="primary-button" id="openNextBtn">Öffnen</button>
        </section>

        <section class="view-switch" aria-label="Ansicht wählen">
          <button data-view="day">Tag</button>
          <button data-view="week" class="active">Woche</button>
          <button data-view="month">Monat</button>
        </section>

        <section class="period-nav">
          <button class="ghost-button" id="prevPeriod">‹</button>
          <div>
            <div class="muted" id="periodLabel"></div>
            <strong id="periodTitle"></strong>
          </div>
          <button class="ghost-button" id="nextPeriod">›</button>
        </section>

        <section id="calendarView" class="calendar-view"></section>
        <button class="fab" id="addWorkoutBtn" aria-label="Training hinzufügen">＋</button>
      </section>

      <section id="page-map" class="page"></section>
      <section id="page-tours" class="page"></section>
      <section id="page-riders" class="page"></section>
      <section id="page-stats" class="page"></section>
      <section id="page-settings" class="page"></section>
    </main>

    <nav class="bottom-nav">
      <button data-page="home" class="active"><span>⌂</span>Start</button>
      <button data-page="training"><span>◫</span>Training</button>
      <button data-page="map"><span>⌖</span>Karte</button>
      <button data-page="tours"><span>♛</span>Touren</button>
      <button data-page="stats"><span>▥</span>Statistik</button>
    </nav>
  </div>

  <dialog id="workoutDialog">
    <form method="dialog" id="workoutForm">
      <div class="dialog-head"><div><div class="eyebrow">TRAININGSTAG</div><h2 id="dialogTitle">Training anlegen</h2></div><button type="button" class="icon-button" id="closeDialog">✕</button></div>
      <input type="hidden" id="workoutId" />
      <label>Datum<input type="date" id="dateInput" required /></label>
      <label>Titel<input type="text" id="titleInput" placeholder="z. B. Grundlagenfahrt" required maxlength="80" /></label>
      <div class="two-col">
        <label>Art<select id="typeInput"><option>Grundlage</option><option>Sweetspot</option><option>Bergtraining</option><option>Regeneration</option><option>Fußball</option><option>Punktspiel</option><option>Kraft</option><option>Ruhetag</option></select></label>
        <label>Zone<select id="zoneInput"><option>-</option><option>Z1</option><option>Z2</option><option>Z3</option><option>Z4</option><option>Z5</option></select></label>
      </div>
      <div class="two-col"><label>Dauer geplant (Min.)<input type="number" id="plannedDurationInput" min="0" step="5" /></label><label>Dauer tatsächlich (Min.)<input type="number" id="actualDurationInput" min="0" step="1" /></label></div>
      <div class="two-col"><label>Kilometer<input type="number" id="kmInput" min="0" step="0.1" /></label><label>Höhenmeter<input type="number" id="hmInput" min="0" step="1" /></label></div>
      <label>Details<textarea id="detailsInput" rows="5" placeholder="Was genau steht an?"></textarea></label>
      <label class="check-row"><input type="checkbox" id="doneInput" /><span>Training erledigt</span></label>
      <div class="dialog-actions"><button type="button" class="danger-button hidden" id="deleteWorkoutBtn">Löschen</button><div class="spacer"></div><button type="button" class="ghost-button" id="cancelBtn">Abbrechen</button><button type="submit" class="primary-button">Speichern</button></div>
    </form>
  </dialog>

  <dialog id="riderDialog">
    <form method="dialog" id="riderForm">
      <div class="dialog-head"><div><div class="eyebrow">FAHRERPOOL</div><h2 id="riderDialogTitle">Fahrer anlegen</h2></div><button type="button" class="icon-button" id="closeRiderDialog">✕</button></div>
      <input type="hidden" id="riderId" />
      <label>Name<input id="riderName" required maxlength="70" /></label>
      <div class="two-col"><label>Nationalität<input id="riderNation" placeholder="z. B. Lettland" /></label><label>Stärke<input id="riderRating" type="number" min="1" max="99" value="70" /></label></div>
      <label>Rolle<select id="riderRole"><option value="gc">Klassement</option><option value="climber">Bergfahrer</option><option value="sprinter">Sprinter</option><option value="helper">Helfer</option><option value="stage">Etappenjäger</option></select></label>
      <div class="dialog-actions"><button type="button" class="danger-button hidden" id="deleteRiderBtn">Löschen</button><div class="spacer"></div><button type="button" class="ghost-button" id="cancelRiderBtn">Abbrechen</button><button type="submit" class="primary-button">Speichern</button></div>
    </form>
  </dialog>

  <dialog id="tourDialog">
    <form method="dialog" id="tourForm">
      <div class="dialog-head"><div><div class="eyebrow">TOUR</div><h2 id="tourDialogTitle">Tour anlegen</h2></div><button type="button" class="icon-button" id="closeTourDialog">✕</button></div>
      <input type="hidden" id="tourId" />
      <label>Name<input id="tourName" required maxlength="80" /></label>
      <div class="two-col"><label>Land<input id="tourCountry" /></label><label>Farbe<input id="tourColor" type="color" value="#ffd400" /></label></div>
      <label>Beschreibung<textarea id="tourDescription" rows="4"></textarea></label>
      <div class="dialog-actions"><button type="button" class="danger-button hidden" id="deleteTourBtn">Löschen</button><div class="spacer"></div><button type="button" class="ghost-button" id="cancelTourBtn">Abbrechen</button><button type="submit" class="primary-button">Speichern</button></div>
    </form>
  </dialog>

  <dialog id="backupDialog">
    <div class="dialog-head"><div><div class="eyebrow">DATENSICHERUNG</div><h2>Backup</h2></div><button type="button" class="icon-button" id="closeBackupDialog">✕</button></div>
    <p class="muted">Sichere Training, Fahrer und Touren regelmäßig.</p>
    <div class="stack"><button class="primary-button" id="exportBackupBtn">Backup exportieren</button><label class="upload-button">Backup importieren<input id="importBackupInput" type="file" accept="application/json" /></label></div>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
