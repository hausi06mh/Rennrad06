</head>
<body>
<header class="top"><div><div class="eyebrow">DEINE RADSPORT-KARRIERE</div><h1>Projekt Nizza <b>V12 Beta Fix 6</b></h1></div><button id="quick" class="round">+</button></header>
<main>
<section id="view-start" class="view active"></section>
<section id="view-training" class="view"></section>
<section id="view-map" class="view"></section>
<section id="view-tours" class="view"></section>
<section id="view-stats" class="view"></section>
</main>
<nav class="bottom">
<button data-view="start" class="active"><span>⌂</span>Start</button><button data-view="training"><span>▦</span>Training</button><button data-view="map"><span>◎</span>Karte</button><button data-view="tours"><span>♛</span>Touren</button><button data-view="stats"><span>▥</span>Statistik</button>
</nav>
<dialog id="modal" class="modal"></dialog>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const KEY='projekt-nizza-v12-fix2';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const roleLabel={gc:'Gesamtfahrer',climber:'Bergfahrer',helper:'Helfer',sprinter:'Sprinter'};
let state=load();
let trainingMode='week';
const todayLocal=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const parseLocalDate=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const localIso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const startMonday=d=>{const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x};
let trainingAnchor=parseLocalDate(todayLocal());
let selectedTrainingDate=todayLocal();
function fresh(){return{trainings:[],teamPool:[],tours:[],activeTourId:null}}
function migrate(raw){
 const out=Object.assign(fresh(),raw&&typeof raw==='object'?raw:{});
 if(!Array.isArray(out.trainings))out.trainings=[];
 if(!Array.isArray(out.teamPool))out.teamPool=[];
 if(!Array.isArray(out.tours))out.tours=[];
 const poolById=new Map();
 out.teamPool=out.teamPool.filter(Boolean).map(team=>{team.id=team.id||uid();team.name=team.name||'Team';team.color=team.color||'#2aa8ff';if(!Array.isArray(team.riders))team.riders=[];team.riders=team.riders.filter(Boolean).map(r=>({id:r.id||uid(),name:r.name||'Fahrer',role:roleLabel[r.role]?r.role:'helper'}));poolById.set(team.id,team);return team});
 for(const tour of out.tours){
  tour.id=tour.id||uid();tour.name=tour.name||'Tour';if(!Array.isArray(tour.stages))tour.stages=[];if(!Array.isArray(tour.teamIds))tour.teamIds=[];
  if(Array.isArray(tour.teams)){
   for(const legacy of tour.teams){
    if(!legacy)continue;legacy.id=legacy.id||uid();legacy.name=legacy.name||'Team';legacy.color=legacy.color||'#2aa8ff';if(!Array.isArray(legacy.riders))legacy.riders=[];
    legacy.riders=legacy.riders.map(r=>({id:r.id||uid(),name:r.name||'Fahrer',role:roleLabel[r.role]?r.role:'helper'}));
    if(!poolById.has(legacy.id)){out.teamPool.push(legacy);poolById.set(legacy.id,legacy)}
    if(!tour.teamIds.includes(legacy.id))tour.teamIds.push(legacy.id);
   }
   delete tour.teams;
  }
  tour.teamIds=tour.teamIds.filter(id=>poolById.has(id));
  for(const stage of tour.stages){if(!Array.isArray(stage.results))stage.results=[];if(!Array.isArray(stage.mountain))stage.mountain=[];if(!Array.isArray(stage.sprint))stage.sprint=[]}
 }
 if(out.activeTourId&&!out.tours.some(t=>t.id===out.activeTourId))out.activeTourId=out.tours[0]?.id||null;
 return out;
}
function load(){try{return migrate(JSON.parse(localStorage.getItem(KEY)))}catch{return fresh()}}
function save(){state=migrate(state);localStorage.setItem(KEY,JSON.stringify(state));renderAll()}
function modal(html,full=false){const d=$('#modal');d.className='modal'+(full?' full':'');d.innerHTML=html;if(!d.open)d.showModal();$$('[data-close]',d).forEach(b=>b.onclick=()=>d.close())}
function show(view){$$('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+view));$$('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));renderAll()}
$$('.bottom button').forEach(b=>b.onclick=()=>show(b.dataset.view));
$('#quick').onclick=()=>{const active=$('.bottom button.active')?.dataset.view||'start';if(active==='tours')openTourForm();else openTrainingForm(null,active==='training'?selectedTrainingDate:todayLocal())};
function totals(){return state.trainings.filter(x=>x.done).reduce((a,x)=>{a.km+=+x.km||0;a.hm+=+x.hm||0;a.min+=+x.min||0;return a},{km:0,hm:0,min:0})}
function renderAll(){renderStart();renderTraining();renderMap();renderTours();renderStats()}
function renderStart(){const t=totals(),tour=activeTour();$('#view-start').innerHTML=`<article class="card"><div class="eyebrow">HEUTE IM BLICK</div><h2>${state.trainings.length?'Dein Plan steht':'Noch kein Training geplant'}</h2><p class="muted">Training, virtuelle Reise und deine Rundfahrten an einem Ort.</p><div class="stats"><div class="stat"><small>Kilometer</small><strong>${t.km.toFixed(0)}</strong></div><div class="stat"><small>Höhenmeter</small><strong>${t.hm.toFixed(0)}</strong></div><div class="stat"><small>Aktive Tour</small><strong>${esc(tour?.name||'–')}</strong></div></div></article><article class="card"><div class="section-head"><h3>Nächster Schritt</h3></div><button class="primary" onclick="show('training')">Training öffnen</button> <button class="secondary" onclick="show('tours')">Touren öffnen</button></article>`}
function openTrainingForm(x=null,presetDate=null){
 const date=x?.date||presetDate||selectedTrainingDate||todayLocal();
 modal(`<div class="modal-head"><h2>${x?'Training bearbeiten':'Training anlegen'}</h2><button data-close class="icon">×</button></div><form id="trainingForm"><label>Datum<input id="trDate" type="date" value="${date}" required></label><label>Titel<input id="trTitle" value="${esc(x?.title||'')}" placeholder="z. B. Grundlagenfahrt" required></label><div class="grid2"><label>Art<select id="trType"><option ${x?.type==='Grundlage'?'selected':''}>Grundlage</option><option ${x?.type==='Lange Fahrt'?'selected':''}>Lange Fahrt</option><option ${x?.type==='Sweetspot'?'selected':''}>Sweetspot</option><option ${x?.type==='Bergtraining'?'selected':''}>Bergtraining</option><option ${x?.type==='Regeneration'?'selected':''}>Regeneration</option><option ${x?.type==='Fußball'?'selected':''}>Fußball</option><option ${x?.type==='Kraft'?'selected':''}>Kraft</option><option ${x?.type==='Mobility'?'selected':''}>Mobility</option><option ${x?.type==='Ruhetag'?'selected':''}>Ruhetag</option><option ${x?.type==='Sonstiges'?'selected':''}>Sonstiges</option></select></label><label>Zone / Intensität<input id="trZone" value="${esc(x?.zone||'')}" placeholder="z. B. Z2"></label></div><div class="grid2"><label>Kilometer<input id="trKm" type="number" step="0.1" min="0" value="${x?.km||0}"></label><label>Höhenmeter<input id="trHm" type="number" min="0" value="${x?.hm||0}"></label></div><label>Dauer Minuten<input id="trMin" type="number" min="0" value="${x?.min||0}"></label><label>Details<textarea id="trDetails" rows="4" placeholder="Was genau ist geplant?">${esc(x?.details||'')}</textarea></label><label style="display:flex;align-items:center;gap:10px"><input id="trDone" type="checkbox" ${x?.done?'checked':''} style="width:auto;margin:0"> Training erledigt</label><p class="training-form-hint">Plan und tatsächliche Einheit bleiben in diesem einen Eintrag.</p><div class="actions"><button class="primary">Speichern</button>${x?'<button type="button" id="delTraining" class="danger">Löschen</button>':''}</div></form>`);
 $('#trainingForm').onsubmit=e=>{e.preventDefault();const obj={id:x?.id||uid(),date:$('#trDate').value,title:$('#trTitle').value.trim(),type:$('#trType').value,zone:$('#trZone').value.trim(),km:+$('#trKm').value||0,hm:+$('#trHm').value||0,min:+$('#trMin').value||0,details:$('#trDetails').value.trim(),done:$('#trDone').checked};const duplicate=state.trainings.find(a=>a.date===obj.date&&a.id!==obj.id);if(duplicate&&!confirm(`Am ${obj.date} gibt es schon "${duplicate.title}". Dieses Training ersetzen?`))return;state.trainings=state.trainings.filter(a=>a.id!==obj.id&&a.id!==duplicate?.id);state.trainings.push(obj);selectedTrainingDate=obj.date;trainingAnchor=parseLocalDate(obj.date);$('#modal').close();save();show('training')};
 if(x)$('#delTraining').onclick=()=>{if(!confirm('Training wirklich löschen?'))return;state.trainings=state.trainings.filter(a=>a.id!==x.id);$('#modal').close();save()}
}
function trainingsOn(date){return state.trainings.filter(x=>x.date===date).sort((a,b)=>a.title.localeCompare(b.title,'de'))}
function dayName(date,full=false){return new Intl.DateTimeFormat('de-DE',{weekday:full?'long':'short'}).format(date)}
function fullDate(date){return new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(date)}
function monthTitle(date){return new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'}).format(date)}
function metricText(x){const bits=[];if(x.type)bits.push(x.type);if(x.min)bits.push(`${x.min} Min`);if(x.zone)bits.push(x.zone);if(x.km)bits.push(`${x.km} km`);if(x.hm)bits.push(`${x.hm} hm`);return bits.join(' · ')||'Details öffnen'}
function trainingChip(x){return `<button class="training-chip ${x.done?'done':''}" data-tr="${x.id}"><strong>${esc(x.title)}</strong><small>${esc(metricText(x))}${x.done?' · ✓ erledigt':''}</small></button>`}
function dayCard(date){const iso=localIso(date),events=trainingsOn(iso),today=iso===todayLocal(),selected=iso===selectedTrainingDate;return `<article class="day-card ${today?'today':''} ${selected?'selected':''}" data-day-open="${iso}"><div class="day-date"><small>${esc(dayName(date))}</small><strong>${String(date.getDate()).padStart(2,'0')}</strong><span>${String(date.getMonth()+1).padStart(2,'0')}.${date.getFullYear()}</span></div><div class="day-events">${events.length?events.map(trainingChip).join(''):`<div class="day-empty"><span>Kein Training geplant</span><button class="secondary" data-add-date="${iso}">+ Eintragen</button></div>`}</div></article>`}
function dayDetail(date){const iso=localIso(date),events=trainingsOn(iso);return `<div class="detail-date">${esc(fullDate(date))}</div>${events.length?events.map(x=>`<article class="day-detail"><div class="section-head"><div><span class="status-badge ${x.done?'done':''}">${x.done?'✓ Erledigt':'Geplant'}</span><h3>${esc(x.title)}</h3></div><div class="row-actions"><button class="icon edit-btn" data-tr="${x.id}" aria-label="Bearbeiten">✎</button><button class="icon delete-btn" data-del-tr="${x.id}" aria-label="Löschen">⌫</button></div></div><div class="detail-meta">${x.type?`<span class="pill">${esc(x.type)}</span>`:''}${x.zone?`<span class="pill">${esc(x.zone)}</span>`:''}${x.min?`<span class="pill">${x.min} Min</span>`:''}${x.km?`<span class="pill">${x.km} km</span>`:''}${x.hm?`<span class="pill">${x.hm} hm</span>`:''}</div>${x.details?`<p class="detail-text">${esc(x.details)}</p>`:'<p class="muted">Keine Details eingetragen.</p>'}<div class="actions"><button class="primary" data-tr="${x.id}">Öffnen & bearbeiten</button><button class="danger" data-del-tr="${x.id}">Training löschen</button></div></article>`).join(''):`<div class="empty"><h3>Kein Training geplant</h3><p>Lege für diesen Tag deine Einheit an.</p><button class="primary" data-add-date="${iso}">+ Training anlegen</button></div>`}`}
function monthGrid(date){const y=date.getFullYear(),m=date.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),offset=(first.getDay()+6)%7;let html='<div class="month-weekdays">'+['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div>${x}</div>`).join('')+'</div><div class="month-grid">';for(let i=0;i<offset;i++)html+='<div class="month-cell blank"></div>';for(let day=1;day<=last.getDate();day++){const d=new Date(y,m,day),iso=localIso(d),events=trainingsOn(iso);html+=`<button class="month-cell ${iso===todayLocal()?'today':''} ${iso===selectedTrainingDate?'selected':''}" data-month-date="${iso}"><span class="month-number">${day}</span>${events.slice(0,2).map(x=>`<span class="month-event ${x.done?'done':''}">${esc(x.title)}</span>`).join('')}${events.length>2?`<span class="month-event">+${events.length-2}</span>`:''}</button>`}return html+'</div>'}
function bindTrainingCalendar(){
 $('#addTraining').onclick=()=>openTrainingForm(null,selectedTrainingDate);
 $$('[data-calendar-mode]').forEach(b=>b.onclick=()=>{trainingMode=b.dataset.calendarMode;renderTraining()});
 $('#calPrev').onclick=()=>{trainingAnchor=trainingMode==='month'?new Date(trainingAnchor.getFullYear(),trainingAnchor.getMonth()-1,1):addDays(trainingAnchor,trainingMode==='week'?-7:-1);selectedTrainingDate=localIso(trainingAnchor);renderTraining()};
 $('#calNext').onclick=()=>{trainingAnchor=trainingMode==='month'?new Date(trainingAnchor.getFullYear(),trainingAnchor.getMonth()+1,1):addDays(trainingAnchor,trainingMode==='week'?7:1);selectedTrainingDate=localIso(trainingAnchor);renderTraining()};
 $('#calToday').onclick=()=>{trainingAnchor=parseLocalDate(todayLocal());selectedTrainingDate=todayLocal();renderTraining()};
 $$('[data-tr]').forEach(b=>b.onclick=e=>{e.stopPropagation();openTrainingForm(state.trainings.find(x=>x.id===b.dataset.tr))});
 $$('[data-del-tr]').forEach(b=>b.onclick=e=>{e.stopPropagation();deleteTraining(b.dataset.delTr)});
 $$('[data-add-date]').forEach(b=>b.onclick=e=>{e.stopPropagation();selectedTrainingDate=b.dataset.addDate;openTrainingForm(null,b.dataset.addDate)});
 $$('[data-day-open]').forEach(card=>card.onclick=e=>{if(e.target.closest('[data-tr],[data-del-tr],[data-add-date]'))return;selectedTrainingDate=card.dataset.dayOpen;trainingAnchor=parseLocalDate(selectedTrainingDate);trainingMode='day';renderTraining()});
 $$('[data-month-date]').forEach(b=>b.onclick=()=>{selectedTrainingDate=b.dataset.monthDate;trainingAnchor=parseLocalDate(selectedTrainingDate);trainingMode='day';renderTraining()});
}
function renderTraining(){
 const root=$('#view-training');let content='',period='';
 if(trainingMode==='week'){const start=startMonday(trainingAnchor),end=addDays(start,6);period=`${String(start.getDate()).padStart(2,'0')}.${String(start.getMonth()+1).padStart(2,'0')}. – ${String(end.getDate()).padStart(2,'0')}.${String(end.getMonth()+1).padStart(2,'0')}.${end.getFullYear()}`;content=`<div class="week-list">${Array.from({length:7},(_,i)=>dayCard(addDays(start,i))).join('')}</div>`}
 else if(trainingMode==='month'){period=monthTitle(trainingAnchor);content=monthGrid(trainingAnchor)}
 else{const d=parseLocalDate(selectedTrainingDate);period=fullDate(d);content=dayDetail(d)}
 root.innerHTML=`<div class="calendar-shell"><div class="calendar-top"><div><div class="eyebrow">TRAININGSKALENDER</div><h2>Wann mache ich was?</h2></div><button id="addTraining" class="primary">+ Einheit</button></div><div class="calendar-modes"><button data-calendar-mode="day" class="tab ${trainingMode==='day'?'active':''}">Tag</button><button data-calendar-mode="week" class="tab ${trainingMode==='week'?'active':''}">Woche</button><button data-calendar-mode="month" class="tab ${trainingMode==='month'?'active':''}">Monat</button></div><div class="calendar-nav"><button id="calPrev" class="secondary">‹</button><button id="calToday" class="secondary calendar-period">${esc(period)}</button><button id="calNext" class="secondary">›</button></div>${content}<div class="calendar-legend">Tippe auf einen Tag für die Tagesansicht. Tippe auf eine Einheit, um sie zu bearbeiten.</div></div>`;
 bindTrainingCalendar()
}
function renderMap(){const t=totals(),progress=Math.min(100,t.km/1100*100);const points=[['Haibach',6],['Wasserburg',25],['Schwaz',43],['Landeck',57],['Bormio',70],['Nizza',94]];$('#view-map').innerHTML=`<div class="section-head"><div><div class="eyebrow">VIRTUELLE REISE</div><h2>Haibach → Nizza</h2></div></div><article class="mapbox"><div class="mapline"><div class="done" style="width:${progress*.88}%"></div><div class="bike" style="left:${6+progress*.88}%">🚴</div>${points.map(p=>`<i class="p" style="left:${p[1]}%"></i><span class="label" style="left:${p[1]}%">${p[0]}</span>`).join('')}</div><div class="route"><span style="width:${progress}%"></span></div><strong>${t.km.toFixed(0)} / 1100 km</strong><p class="muted">Der Radfahrer bewegt sich mit deinen als erledigt markierten Radkilometern.</p></article>`}
function activeTour(){return state.tours.find(t=>t.id===state.activeTourId)||state.tours[0]||null}
function selectedTeams(t){const ids=new Set(Array.isArray(t?.teamIds)?t.teamIds:[]);return state.teamPool.filter(team=>ids.has(team.id))}
function allRiders(t){return selectedTeams(t).flatMap(team=>team.riders.map(r=>({...r,teamId:team.id,teamName:team.name}))) }
function usedRiderIdsForTeam(team){return new Set(team.riders.map(r=>r.id))}
function cleanupRiderIds(ids){
 const set=ids instanceof Set?ids:new Set(ids);
 for(const tour of state.tours)for(const stage of tour.stages){stage.results=stage.results.filter(x=>!set.has(x.riderId));stage.mountain=stage.mountain.filter(x=>!set.has(x.riderId));stage.sprint=stage.sprint.filter(x=>!set.has(x.riderId))}
}

function closeModal(){const d=$('#modal');if(d.open)d.close()}
function deleteTraining(id){const x=state.trainings.find(t=>t.id===id);if(!x)return;if(!confirm(`Training „${x.title}“ wirklich löschen?`))return;state.trainings=state.trainings.filter(t=>t.id!==id);save();renderTraining()}
function deleteTour(t){if(!t)return false;const counts={stages:t.stages.length,entries:t.stages.reduce((n,s)=>n+s.results.length+s.mountain.length+s.sprint.length,0)};if(!confirm(`Tour „${t.name}“ wirklich löschen?\n\n${counts.stages} Etappen und ${counts.entries} Wertungseinträge werden entfernt.`))return false;state.tours=state.tours.filter(x=>x.id!==t.id);state.activeTourId=state.tours[0]?.id||null;closeModal();save();show('tours');return true}
function deleteStage(t,s){if(!confirm(`Etappe „${s.name}“ wirklich löschen? Alle Zeiten und Punkte dieser Etappe werden entfernt.`))return false;t.stages=t.stages.filter(x=>x.id!==s.id);closeModal();save();openTour(t.id,'stages');return true}
function deleteTeamDirect(team){const used=state.tours.filter(t=>t.teamIds?.includes(team.id));const msg=used.length?`Team „${team.name}“ ist in ${used.length} Tour(en) ausgewählt. Das Team, seine Fahrer und deren Wertungen werden überall gelöscht. Fortfahren?`:`Team „${team.name}“ und alle Fahrer wirklich löschen?`;if(!confirm(msg))return false;const ids=usedRiderIdsForTeam(team);cleanupRiderIds(ids);state.teamPool=state.teamPool.filter(x=>x.id!==team.id);for(const t of state.tours)t.teamIds=(t.teamIds||[]).filter(id=>id!==team.id);save();openTeamPool();return true}
function deleteRiderDirect(team,rider){if(!confirm(`Fahrer „${rider.name}“ wirklich löschen? Seine Wertungen werden ebenfalls entfernt.`))return false;cleanupRiderIds([rider.id]);team.riders=team.riders.filter(x=>x.id!==rider.id);save();openTeamPool();return true}
function deleteStageEntry(t,s,key,riderId){const label=key==='results'?'Zeit':key==='mountain'?'Bergpunkte':'Sprintpunkte';if(!confirm(`${label} von ${riderName(t,riderId)} wirklich löschen?`))return;s[key]=s[key].filter(x=>x.riderId!==riderId);save();openStage(t,s,key==='results'?'stage':key)}
function openTourForm(tour=null){
 modal(`<div class="modal-head"><div class="header-main"><button id="tourFormBack" type="button" class="icon back-btn">‹</button><h2>${tour?'Tour bearbeiten':'Neue Tour'}</h2></div><button data-close class="icon">×</button></div><form id="tourForm"><label>Name<input id="tourName" value="${esc(tour?.name||'')}" placeholder="z. B. Tour de l'Ain" required></label><p class="muted">Teams wählst du anschließend aus deinem zentralen Team-Pool aus.</p><div class="actions"><button class="primary">${tour?'Änderungen speichern':'Tour erstellen'}</button>${tour?'<button type="button" id="deleteTourForm" class="danger">Tour löschen</button>':''}</div></form>`);
 $('#tourFormBack').onclick=()=>tour?openTour(tour.id,'teams'):closeModal();
 $('#tourForm').onsubmit=e=>{e.preventDefault();const name=$('#tourName').value.trim();if(tour){tour.name=name;closeModal();save();openTour(tour.id,'teams')}else{const t={id:uid(),name,teamIds:[],stages:[]};state.tours.push(t);state.activeTourId=t.id;closeModal();save();openTeamSelector(t)}};
 if(tour)$('#deleteTourForm').onclick=()=>deleteTour(tour)
}
function openTeamForm(team=null){
 modal(`<div class="modal-head"><div class="header-main"><button id="teamFormBack" type="button" class="icon back-btn">‹</button><h2>${team?'Team bearbeiten':'Team anlegen'}</h2></div><button data-close class="icon">×</button></div><form id="teamForm"><label>Teamname<input id="teamName" value="${esc(team?.name||'')}" required></label><label>Teamfarbe<input id="teamColor" type="color" value="${team?.color||'#2aa8ff'}"></label><div class="actions"><button class="primary">Speichern</button>${team?'<button type="button" id="deleteTeam" class="danger">Team löschen</button>':''}</div></form>`);
 $('#teamFormBack').onclick=openTeamPool;
 $('#teamForm').onsubmit=e=>{e.preventDefault();const name=$('#teamName').value.trim(),color=$('#teamColor').value;if(team){team.name=name;team.color=color}else state.teamPool.push({id:uid(),name,color,riders:[]});save();openTeamPool()};
 if(team)$('#deleteTeam').onclick=()=>deleteTeamDirect(team)
}
function openRiderForm(team,rider=null){
 modal(`<div class="modal-head"><div class="header-main"><button id="riderFormBack" type="button" class="icon back-btn">‹</button><h2>${rider?'Fahrer bearbeiten':'Fahrer anlegen'}</h2></div><button data-close class="icon">×</button></div><form id="riderForm"><label>Name<input id="riderName" value="${esc(rider?.name||'')}" required></label><label>Rolle<select id="riderRole"><option value="gc" ${rider?.role==='gc'?'selected':''}>Gesamtfahrer</option><option value="climber" ${rider?.role==='climber'?'selected':''}>Bergfahrer</option><option value="helper" ${rider?.role==='helper'?'selected':''}>Helfer</option><option value="sprinter" ${rider?.role==='sprinter'?'selected':''}>Sprinter</option></select></label><div class="actions"><button class="primary">Speichern</button>${rider?'<button type="button" id="deleteRider" class="danger">Fahrer löschen</button>':''}</div></form>`);
 $('#riderFormBack').onclick=openTeamPool;
 $('#riderForm').onsubmit=e=>{e.preventDefault();const data={name:$('#riderName').value.trim(),role:$('#riderRole').value};if(rider){rider.name=data.name;rider.role=data.role}else team.riders.push({id:uid(),...data});save();openTeamPool()};

function riderName(t,id){return allRiders(t).find(r=>r.id===id)?.name||'Unbekannt'}

function fmtTime(sec){sec=Math.max(0,Math.round(sec||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function fmtGap(sec){sec=Math.max(0,Math.round(sec||0));const m=Math.floor(sec/60),s=sec%60;return `+${m?m+':':''}${String(s).padStart(2,'0')}`}

}
function drawOverall(t,root){const last=[...t.stages].reverse().find(s=>s.results.length||s.mountain.length||s.sprint.length);if(!last){root.innerHTML='<div class="empty">Noch keine Wertungen.</div>';return}root.innerHTML=`<article class="card"><h3>Gesamt nach ${esc(last.name)}</h3>${rowsHtml(t,gcAfter(t,last),'time')}</article><article class="card"><h3>Bergwertung gesamt</h3>${rowsHtml(t,pointsAfter(t,last,'mountain'),'points')}</article><article class="card"><h3>Sprintwertung gesamt</h3>${rowsHtml(t,pointsAfter(t,last,'sprint'),'points')}</article>`}
function renderStats(){const t=totals();$('#view-stats').innerHTML=`<div class="section-head"><div><div class="eyebrow">STATISTIK</div><h2>Dein Fortschritt</h2></div></div><div class="stats"><div class="stat"><small>Kilometer</small><strong>${t.km.toFixed(0)}</strong></div><div class="stat"><small>Höhenmeter</small><strong>${t.hm.toFixed(0)}</strong></div><div class="stat"><small>Fahrzeit</small><strong>${Math.floor(t.min/60)} h</strong></div></div>`}
renderAll();
</script>
</body></html>
