<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#061427" />
  <title>Projekt Nizza V12 Alpha</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div><span class="eyebrow">DEINE RADSPORT-KARRIERE</span><h1>Projekt Nizza <b>V12 Alpha</b></h1></div>
    <button id="quickAdd" class="round-btn" aria-label="Neu">+</button>
  </header>

  <main id="app">
    <section id="view-start" class="view active"></section>
    <section id="view-training" class="view"></section>
    <section id="view-map" class="view"></section>
    <section id="view-tours" class="view"></section>
    <section id="view-stats" class="view"></section>
  </main>

  <nav class="bottom-nav">
    <button data-view="start" class="active"><span>⌂</span>Start</button>
    <button data-view="training"><span>▦</span>Training</button>
    <button data-view="map"><span>◎</span>Karte</button>
    <button data-view="tours"><span>♛</span>Touren</button>
    <button data-view="stats"><span>▥</span>Statistik</button>
  </nav>

  <dialog id="workoutDialog" class="modal"><form id="workoutForm" method="dialog">
    <div class="modal-head"><h2 id="workoutTitle">Training</h2><button type="button" class="icon-btn" data-close>×</button></div>
    <input type="hidden" id="workoutId" />
    <label>Datum<input id="wDate" type="date" required /></label>
    <label>Titel<input id="wTitle" required placeholder="z. B. Grundlagenfahrt" /></label>
    <div class="grid2"><label>Art<select id="wType"><option>Grundlage</option><option>Sweetspot</option><option>Bergtraining</option><option>Regeneration</option><option>Fußball</option><option>Punktspiel</option><option>Kraft</option><option>Ruhetag</option></select></label><label>Zone<input id="wZone" placeholder="Z2" /></label></div>
    <div class="grid2"><label>Geplant (Min.)<input id="wPlanned" type="number" min="0" /></label><label>Tatsächlich (Min.)<input id="wActual" type="number" min="0" /></label></div>
    <div class="grid2"><label>Kilometer<input id="wKm" type="number" min="0" step="0.1" /></label><label>Höhenmeter<input id="wHm" type="number" min="0" /></label></div>
    <label>Details<textarea id="wDetails" rows="4"></textarea></label>
    <label class="check"><input id="wDone" type="checkbox" /> Erledigt</label>
    <div class="actions"><button type="button" id="deleteWorkout" class="danger hidden">Löschen</button><button class="primary" value="save">Speichern</button></div>
  </form></dialog>

  <dialog id="tourDialog" class="modal"><form id="tourForm" method="dialog">
    <div class="modal-head"><h2>Tour</h2><button type="button" class="icon-btn" data-close>×</button></div>
    <input type="hidden" id="tourId" />
    <label>Name<input id="tourName" required placeholder="Tour de l'Ain" /></label>
    <div class="grid2"><label>Land<input id="tourCountry" placeholder="Frankreich" /></label><label>Etappen<input id="tourStages" type="number" min="1" value="3" /></label></div>
    <label>Notiz<textarea id="tourNote" rows="3"></textarea></label>
    <div class="actions"><button type="button" id="deleteTour" class="danger hidden">Löschen</button><button class="primary">Speichern</button></div>
  </form></dialog>

  <dialog id="riderDialog" class="modal"><form id="riderForm" method="dialog">
    <div class="modal-head"><h2>Fahrer</h2><button type="button" class="icon-btn" data-close>×</button></div>
    <input type="hidden" id="riderId" />
    <label>Name<input id="riderName" required /></label>
    <div class="grid2"><label>Nationalität<input id="riderNation" placeholder="Lettland" /></label><label>Stärke<input id="riderRating" type="number" min="1" max="99" value="70" /></label></div>
    <label>Rolle<select id="riderRole"><option value="gc">Klassement</option><option value="climber">Bergfahrer</option><option value="sprinter">Sprinter</option><option value="helper">Helfer</option><option value="puncheur">Etappenjäger</option></select></label>
    <div class="actions"><button type="button" id="deleteRider" class="danger hidden">Löschen</button><button class="primary">Speichern</button></div>
  </form></dialog>

  <dialog id="detailDialog" class="modal"><div class="modal-head"><h2 id="detailTitle">Details</h2><button type="button" class="icon-btn" data-close>×</button></div><div id="detailBody"></div></dialog>

  <script src="app.js"></script>
</body>
</html>
